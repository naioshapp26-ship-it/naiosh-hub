<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980" role="img" aria-label="???? ??? ??????? ????? ????????">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1834"/>
      <stop offset="50%" stop-color="#070d1c"/>
      <stop offset="100%" stop-color="#102448"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2f58" stop-opacity=".94"/>
      <stop offset="100%" stop-color="#0c1832" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3aa0ff"/>
      <stop offset="60%" stop-color="#4fd6ff"/>
      <stop offset="100%" stop-color="#d4a24a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#194878"/>
      <stop offset="100%" stop-color="#4fd6ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ee7ff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="980" rx="36" fill="url(#bg)"/>
