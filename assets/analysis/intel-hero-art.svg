<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 740" role="img" aria-label="*5H1 AFJ DE1C2 BJ'/) (J'F'*">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1630"/>
      <stop offset="45%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0c2040"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d55" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#0c1730" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3aa0ff"/>
      <stop offset="55%" stop-color="#4fd6ff"/>
      <stop offset="100%" stop-color="#d4a24a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1b4f8a"/>
      <stop offset="100%" stop-color="#4fd6ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ee7ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="740" fill="url(#bg)"/>
  <circle cx="220" cy="160" r="160" fill="url(#orb)"/>
  <circle cx="1180" cy="520" r="200" fill="url(#orb)" opacity=".7"/>

  <!-- back waveform -->
  <path d="M80 520 C220 420, 340 610, 480 500 S760 390, 900 470 S1180 560, 1360 430"
        fill="none" stroke="#2a6aaa" stroke-width="2" opacity=".45"/>
  <path d="M80 540 C240 460, 360 600, 520 520 S820 400, 980 490 S1220 580, 1360 460"
        fill="none" stroke="#4fd6ff" stroke-width="1.5" opacity=".35"/>

  <!-- left bar panel -->
  <g transform="translate(90,170)">
    <rect width="220" height="320" rx="22" fill="url(#glass)" stroke="#4a7ab8" stroke-opacity=".45"/>
    <text x="24" y="42" fill="#c9d7f2" font-family="Segoe UI, Arial" font-size="16" font-weight="700">Signals</text>
    <rect x="36" y="250" width="28" height="40" rx="6" fill="url(#bar)"/>
    <rect x="76" y="210" width="28" height="80" rx="6" fill="url(#bar)"/>
    <rect x="116" y="170" width="28" height="120" rx="6" fill="url(#bar)"/>
    <rect x="156" y="130" width="28" height="160" rx="6" fill="url(#bar)"/>
    <circle cx="50" cy="70" r="4" fill="#d4a24a"/>
    <text x="64" y="75" fill="#9eb2d4" font-family="Segoe UI, Arial" font-size="13">Live feed</text>
  </g>

  <!-- center dashboard -->
  <g transform="translate(360,110)" filter="url(#glow)">
    <rect width="720" height="420" rx="26" fill="url(#glass)" stroke="#5aa8e8" stroke-opacity=".55"/>
    <text x="36" y="48" fill="#f0f6ff" font-family="Segoe UI, Arial" font-size="26" font-weight="700">Analytic Dashboard</text>
    <text x="36" y="74" fill="#8fa6c9" font-family="Segoe UI, Arial" font-size="14">Command view · artistic concept</text>
    <!-- grid -->
    <g opacity=".25" stroke="#7aa8d8" stroke-width="1">
      <line x1="40" y1="120" x2="680" y2="120"/>
      <line x1="40" y1="180" x2="680" y2="180"/>
      <line x1="40" y1="240" x2="680" y2="240"/>
      <line x1="40" y1="300" x2="680" y2="300"/>
      <line x1="40" y1="360" x2="680" y2="360"/>
    </g>
    <path d="M50 320 C120 280, 170 200, 240 230 S340 310, 410 250 S520 140, 600 170 S660 240, 690 210"
          fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <g fill="#4fd6ff">
      <circle cx="240" cy="230" r="6"/><circle cx="410" cy="250" r="6"/>
      <circle cx="600" cy="170" r="6"/><circle cx="690" cy="210" r="6"/>
    </g>
    <g fill="#d4a24a">
      <circle cx="120" cy="285" r="5"/><circle cx="520" cy="185" r="5"/>
    </g>
    <!-- mini kpis -->
    <g transform="translate(40,380)">
      <rect width="140" height="28" rx="8" fill="#10203c" stroke="#3d6aa0"/>
      <text x="14" y="19" fill="#9ec9ff" font-family="Segoe UI, Arial" font-size="13">Insight · 98.2</text>
    </g>
  </g>

  <!-- right gauges -->
  <g transform="translate(1120,150)">
    <rect width="230" height="200" rx="22" fill="url(#glass)" stroke="#4a7ab8" stroke-opacity=".45"/>
    <text x="22" y="36" fill="#c9d7f2" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Quality</text>
    <circle cx="115" cy="120" r="58" fill="none" stroke="#1c3558" stroke-width="12"/>
    <circle cx="115" cy="120" r="58" fill="none" stroke="#4fd6ff" stroke-width="12"
            stroke-dasharray="260" stroke-dashoffset="70" stroke-linecap="round" transform="rotate(-90 115 120)"/>
    <text x="115" y="128" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="28" font-weight="700">72%</text>
  </g>

  <g transform="translate(1120,380)">
    <rect width="230" height="150" rx="22" fill="url(#glass)" stroke="#4a7ab8" stroke-opacity=".45"/>
    <text x="22" y="36" fill="#c9d7f2" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Throughput</text>
    <text x="22" y="88" fill="#4fd6ff" font-family="Segoe UI, Arial" font-size="36" font-weight="700">15.28</text>
    <text x="22" y="120" fill="#8fa6c9" font-family="Segoe UI, Arial" font-size="13">units / cycle</text>
  </g>

  <!-- floating chip -->
  <g transform="translate(640,560)">
    <rect width="170" height="54" rx="14" fill="#101c34" stroke="#d4a24a" stroke-opacity=".55"/>
    <text x="18" y="33" fill="#e8c278" font-family="Segoe UI, Arial" font-size="16" font-weight="700">Decision layer</text>
  </g>
</svg>
