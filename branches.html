<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الفروع | نايوش هوب 360</title>
  <meta name="description" content="فروع نايوش هوب حول العالم — نفس شبكة فروع ERP عبر أكثر من 25 دولة." />
  <link rel="icon" href="assets/logo-hub.jpeg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/hub-theme.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
  <link rel="stylesheet" href="css/hub-row-actions.css" />
  <link rel="stylesheet" href="css/hub-branches.css" />
</head>
<body class="homepage branches-page" data-hub-entity="branches">
  <header class="top-nav">
    <div class="container inner">
      <div class="nav-main">
        <a class="brand" href="index.html">
          <img src="assets/logo-hub.jpeg" alt="شعار نايوش هوب" />
          <span class="logo-text">NAIOSH <span class="hub-mark">HUB</span></span>
        </a>
        <nav class="nav-links" aria-label="روابط نايوش هوب">
          <a href="index.html">الرئيسية</a>
          <a href="products.html">المنتجات</a>
          <a href="store.html">المتجر</a>
          <a href="ads.html">الإعلانات</a>
          <a href="events.html">الفعاليات</a>
          <a href="apps.html">الأنظمة</a>
          <a href="platforms.html">المنصات</a>
          <a class="active" href="branches.html">الفروع</a>
        </nav>
      </div>
      <div class="auth-actions" aria-label="إجراءات الحساب">
        <a href="dashboard.html" class="auth-btn primary">غرفة العمليات</a>
        <a href="login.html" class="auth-btn">تسجيل الدخول</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="branches-showcase">
      <header class="branches-head">
        <h1>فروعنا حول العالم</h1>
        <p>شبكة الفروع العالمية مصممة لتقديم تجربة موحدة واحترافية عبر مواقعنا المختلفة.</p>
      </header>
      <div class="branches-toolbar">
        <input id="branchSearch" type="search" placeholder="ابحث عن الفرع أو الدولة..." aria-label="بحث الفروع" />
        <select id="branchTypeFilter" aria-label="تصفية نوع الفرع">
          <option value="all">كل الأنواع</option>
          <option value="المقر الرئيسي">المقر الرئيسي</option>
          <option value="مكاتب خاصة">مكاتب خاصة</option>
          <option value="حاضنة أعمال">حاضنة أعمال</option>
          <option value="مسرعة أعمال">مسرعة أعمال</option>
        </select>
        <button type="button" id="branchFilterAll" class="branches-filter-all">الكل</button>
      </div>
      <p id="branchFilterStatus" class="sr-only" aria-live="polite"></p>
      <section class="branch-grid" id="branchGrid" aria-label="شبكة الفروع"></section>
    </section>
  </main>

  <nav class="floating-actions" aria-label="أزرار جانبية عائمة">
    <a href="index.html" title="الرئيسية" aria-label="الرئيسية"><i class="fas fa-house"></i></a>
    <a href="dashboard.html" title="غرفة العمليات" aria-label="غرفة العمليات"><i class="fas fa-gauge-high"></i></a>
    <a href="login.html" title="دخول" aria-label="دخول"><i class="fas fa-right-to-bracket"></i></a>
    <button type="button" id="to-top" title="الصعود للأعلى" aria-label="الصعود للأعلى"><i class="fas fa-arrow-up"></i></button>
  </nav>

  <script src="js/empire-blueprint.js"></script>
  <script src="js/sovereign-platforms.js"></script>
  <script src="js/hub-marketplace-data.js"></script>
  <script src="js/hub-branches-data.js"></script>
  <script src="js/hub-store.js"></script>
  <script src="js/hub-row-actions.js"></script>
  <script src="js/hub-branches.js"></script>
  <script src="js/mobile-nav.js"></script>
  <script src="js/hub-global-back.js" defer></script>
  <script src="js/hub-page-guide.js" defer></script>
</body>
</html>
