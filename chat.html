<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دردشة داخلية | نايوش هوب 360</title>
  <link rel="icon" href="assets/logo-hub.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/hub-theme.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
  <link rel="stylesheet" href="css/hub-header-actions.css?v=6" />
</head>
<body class="homepage">
  <header class="top-nav">
    <div class="container inner">
      <div class="nav-main">
        <a class="brand" href="index.html"><img src="assets/logo-hub.jpeg" alt="نايوش هوب" /><span class="logo-text">NAIOSH <span class="hub-mark">HUB</span></span></a>
        <nav class="nav-links" aria-label="روابط نايوش هوب">
          <a href="index.html">الرئيسية</a>
          <a href="dashboard.html">غرفة العمليات</a>
          <a href="apps.html">الأنظمة</a>
        </nav>
      </div>
      <div class="auth-actions">
        <a href="dashboard.html" class="auth-btn primary">غرفة العمليات</a>
        <a href="login.html" class="auth-btn">تسجيل الدخول</a>
      </div>
    </div>
  </header>

  <main class="container hub-feature-page">
    <section class="hub-feature-hero">
      <h1>دردشة داخلية</h1>
      <p>قناة تنسيق فورية بين الفرق والفروع وغرفة العمليات — قبل «أخرى» في منيو الهيرو مباشرة.</p>
    </section>

    <section class="hub-chat-layout" aria-label="واجهة الدردشة الداخلية">
      <aside class="hub-chat-rooms">
        <h2>الغرف</h2>
        <div id="hub-chat-rooms"></div>
      </aside>
      <div class="hub-chat-panel">
        <div class="hub-chat-panel-head" id="hub-chat-title">غرفة العمليات</div>
        <div class="hub-chat-messages" id="hub-chat-messages" aria-live="polite"></div>
        <form class="hub-chat-compose" id="hub-chat-form">
          <input id="hub-chat-input" type="text" placeholder="اكتب رسالة داخلية..." autocomplete="off" required />
          <button type="submit">إرسال</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/hub-header-actions.js"></script>
  <script src="js/hub-chat.js"></script>
  <script src="js/hub-global-back.js" defer></script>
  <script src="js/hub-page-guide.js" defer></script>
</body>
</html>
