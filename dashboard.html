    <script>
    /* Gate: CLIENT never sees the ops room — runs before any UI */
    (function () {
      try {
        var token = localStorage.getItem('hubAuthToken') || sessionStorage.getItem('hubAuthToken');
        var raw = localStorage.getItem('hubUser') || sessionStorage.getItem('hubUser');
        if (!token || !raw) {
          location.replace('login.html?next=' + encodeURIComponent('dashboard.html'));
          return;
        }
        var u = JSON.parse(raw);
        var r = String(u && u.role || '').toLowerCase();
        if (r === 'customer' || r === 'client' || r === 'client_user' || r === 'platform_owner') {
          try {
            sessionStorage.setItem('hubAuthFlash', 'ليس لديك صلاحية للوصول إلى هذه الصفحة.');
          } catch (e2) {}
          location.replace('client.html');
        }
      } catch (e) {
        location.replace('login.html?next=' + encodeURIComponent('dashboard.html'));
      }
    })();
    </script>
