<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعادة كلمة المرور | نايوش هوب 360</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#B91C1C', dark: '#991B1B', 50: '#FEF2F2' },
          },
          fontFamily: { sans: ['Cairo', 'Tahoma', 'sans-serif'] },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
</head>
<body class="bg-gradient-to-br from-gray-50 via-white to-red-50 min-h-screen font-sans">
  <div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8 border border-gray-100">
      <h1 class="text-2xl font-extrabold text-black mb-2 text-center">استعادة كلمة المرور</h1>
      <p class="text-sm text-gray-600 text-center mb-6">أدخل بريدك لإرسال رابط إعادة التعيين. لن نُرسل كلمة المرور القديمة.</p>

      <div id="alertMessage" class="hidden mb-4 p-3 rounded-lg border text-sm"></div>

      <form id="forgotForm" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-semibold mb-2">البريد الإلكتروني</label>
          <input id="email" type="email" required autocomplete="email" class="w-full border border-gray-300 rounded-lg px-3 py-3 bg-gray-50 focus:ring-2 focus:ring-primary focus:outline-none" placeholder="name@example.com" />
        </div>
        <button type="submit" class="w-full py-3 rounded-lg bg-primary text-white font-bold hover:bg-primary-dark">إرسال رابط الاستعادة</button>
      </form>

      <div id="resetPanel" class="hidden mt-8 pt-6 border-t border-gray-100 space-y-4">
        <p class="text-sm text-gray-600">أدخل رمز إعادة التعيين وكلمة المرور الجديدة.</p>
        <form id="resetForm" class="space-y-3">
          <input id="resetToken" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-3" placeholder="رمز إعادة التعيين" autocomplete="one-time-code" dir="ltr" />
          <input id="newPassword" type="password" required minlength="8" class="w-full border border-gray-300 rounded-lg px-3 py-3" placeholder="كلمة المرور الجديدة" autocomplete="new-password" />
          <input id="confirmPassword" type="password" required minlength="8" class="w-full border border-gray-300 rounded-lg px-3 py-3" placeholder="تأكيد كلمة المرور الجديدة" autocomplete="new-password" />
          <button type="submit" class="w-full py-3 rounded-lg bg-black text-white font-bold">تعيين كلمة المرور الجديدة</button>
        </form>
      </div>

      <div class="mt-6 text-center text-sm">
        <a href="login.html" class="text-primary font-semibold hover:underline">العودة لتسجيل الدخول</a>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const alertEl = document.getElementById('alertMessage');
      let lastEmail = '';
      function show(msg, type) {
        alertEl.className = 'mb-4 p-3 rounded-lg border text-sm ' + (type === 'ok' ? 'bg-black text-white border-black' : 'bg-red-50 text-red-700 border-red-200');
        alertEl.textContent = msg;
        alertEl.classList.remove('hidden');
      }
      document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        lastEmail = document.getElementById('email').value.trim().toLowerCase();
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ email: lastEmail }),
        });
        const data = await res.json().catch(() => ({}));
        show(data.message || 'إذا كان البريد مسجّلاً، ستصلك تعليمات إعادة التعيين.', 'ok');
        document.getElementById('resetPanel').classList.remove('hidden');
        if (data.resetToken) {
          document.getElementById('resetToken').value = data.resetToken;
          show((data.message || '') + ' (بيئة اختبار: الرمز معروض لأن خدمة البريد غير مهيأة.)', 'ok');
        }
        if (data.emailServiceConfigured === false) {
          show('إذا كان البريد مسجّلاً يمكنك المتابعة برمز الاستعادة. خدمة البريد غير مهيأة على هذه البيئة.', 'ok');
        }
      });
      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (newPassword !== confirmPassword) {
          show('تأكيد كلمة المرور غير متطابق.', 'err');
          return;
        }
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({
            email: lastEmail || document.getElementById('email').value.trim().toLowerCase(),
            token: document.getElementById('resetToken').value.trim(),
            newPassword,
            confirmPassword,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          show(data.error || 'تعذر تعيين كلمة المرور.', 'err');
          return;
        }
        show(data.message || 'تم تعيين كلمة المرور الجديدة.', 'ok');
        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
      });
      const params = new URLSearchParams(location.search);
      if (params.get('email')) document.getElementById('email').value = params.get('email');
      if (params.get('token')) {
        document.getElementById('resetPanel').classList.remove('hidden');
        document.getElementById('resetToken').value = params.get('token');
        lastEmail = (params.get('email') || '').toLowerCase();
      }
    })();
  </script>
</body>
</html>
