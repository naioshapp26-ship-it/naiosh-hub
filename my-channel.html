<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قناتي | نايوش هوب 360</title>
  <meta name="description" content="قناتي تفتح قناتك الخاصة لرفع الفيديوهات وربط يوتيوب أو أي منصة اجتماعية." />
  <link rel="icon" href="assets/logo-hub.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/hub-theme.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
  <link rel="stylesheet" href="css/hub-ai-assistant.css?v=4" />
  <link rel="stylesheet" href="css/hub-header-actions.css?v=19" />
  <link rel="stylesheet" href="css/hub-dark-surfaces.css?v=20260815-contrast" />
  <link rel="stylesheet" href="css/hub-tenant-workspace.css?v=5" />
</head>
<body class="homepage">
  <header class="top-nav">
    <div class="container inner">
      <div class="nav-main">
        <a class="brand" href="index.html"><img src="assets/logo-hub.jpeg" alt="نايوش هوب" /><span class="logo-text">NAIOSH <span class="hub-mark">HUB</span></span></a>
        <nav class="nav-links">
          <a href="index.html">الرئيسية</a>
          <a class="active" href="my-channel.html">قناتي</a>
          <a href="side-project-registrations.html">طلبات المشاريع</a>
        </nav>
      </div>
      <div class="auth-actions">
        <a href="login.html" class="auth-btn">تسجيل الدخول</a>
        <a href="dashboard.html" class="auth-btn primary">لوحة التحكم</a>
      </div>
    </div>
  </header>

  <main class="container hub-feature-page hub-mine-page" data-my-channel>
    <section class="hub-feature-hero">
      <p class="hub-feature-kicker"><i class="fas fa-video"></i> قناة المستخدم الخاصة</p>
      <h1>قناتي</h1>
      <p>عند الضغط على <strong>قناتي</strong> تفتح قناتك الخاصة: ارفع فيديوهاتك واربط رابطًا مباشرًا من قناتك على يوتيوب أو أي منصة اجتماعية.</p>
    </section>

    <div class="hub-mine-toolbar">
      <label>
        إيميل القناة
        <input type="email" data-channel-email placeholder="example@gmail.com" dir="ltr" autocomplete="email" />
      </label>
      <button type="button" class="btn btn-primary" data-channel-lookup><i class="fas fa-search"></i> فتح قناتي</button>
    </div>
    <p data-channel-meta class="hub-mine-meta">أدخلي إيميلك لفتح قناتك الخاصة</p>

    <section class="hub-mine-card" style="margin-bottom:18px">
      <h2><i class="fas fa-link"></i> ربط القناة</h2>
      <div class="hub-mine-toolbar" style="margin-top:10px">
        <label>اسم القناة <input type="text" data-channel-title placeholder="قناتي" /></label>
        <label>رابط يوتيوب <input type="url" data-channel-youtube placeholder="https://youtube.com/..." dir="ltr" /></label>
        <label>رابط سوشيال <input type="url" data-channel-social placeholder="https://..." dir="ltr" /></label>
        <button type="button" class="btn btn-primary" data-channel-save><i class="fas fa-floppy-disk"></i> حفظ الروابط</button>
      </div>
    </section>

    <section class="hub-mine-card" style="margin-bottom:18px">
      <h2><i class="fas fa-upload"></i> رفع فيديو (رابط)</h2>
      <div class="hub-mine-toolbar" style="margin-top:10px">
        <label>عنوان الفيديو <input type="text" data-video-title placeholder="عنوان الفيديو" /></label>
        <label>رابط الفيديو <input type="url" data-video-url placeholder="https://..." dir="ltr" /></label>
        <label>ملاحظة <input type="text" data-video-note placeholder="اختياري" /></label>
        <button type="button" class="btn btn-primary" data-channel-add-video><i class="fas fa-plus"></i> أضف فيديو</button>
      </div>
    </section>

    <div data-channel-root></div>
  </main>

  <script src="js/hub-auth.js"></script>
  <script src="js/hub-client-channels.js?v=1"></script>
  <script src="js/hub-my-channel.js?v=1"></script>
  <script src="js/hub-upload-limits.js?v=1"></script>
  <script src="js/hub-header-actions.js?v=18"></script>
  <script src="js/hub-control-nav.js?v=3"></script>
  <script src="js/hub-global-back.js" defer></script>
  <script src="js/hub-ai-assistant.js?v=4" defer></script>
</body>
</html>
