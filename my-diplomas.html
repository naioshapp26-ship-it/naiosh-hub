<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دبلوماتي | نايوش هوب 360</title>
  <meta name="description" content="دبلوماتي تعرض فقط دبلومات المستخدم الخاصة — ليست كتالوج الدبلومات العام." />
  <link rel="icon" href="assets/logo-hub.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/hub-theme.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
  <link rel="stylesheet" href="css/hub-ai-assistant.css?v=4" />
  <link rel="stylesheet" href="css/hub-header-actions.css?v=19" />
  <link rel="stylesheet" href="css/hub-dark-surfaces.css?v=20260815-contrast" />
  <link rel="stylesheet" href="css/hub-tenant-workspace.css?v=5" />
</head>
<body class="homepage">
  <header class="top-nav">
    <div class="container inner">
      <div class="nav-main">
        <a class="brand" href="index.html"><img src="assets/logo-hub.jpeg" alt="نايوش هوب" /><span class="logo-text">NAIOSH <span class="hub-mark">HUB</span></span></a>
        <nav class="nav-links">
          <a href="index.html">الرئيسية</a>
          <a class="active" href="my-diplomas.html">دبلوماتي</a>
          <a href="diplomas.html">كتالوج الدبلومات</a>
          <a href="my-courses.html">دوراتي</a>
        </nav>
      </div>
      <div class="auth-actions">
        <a href="login.html" class="auth-btn">تسجيل الدخول</a>
        <a href="dashboard.html" class="auth-btn primary">لوحة التحكم</a>
      </div>
    </div>
  </header>

  <main class="container hub-feature-page hub-mine-page" data-my-learning="diploma">
    <section class="hub-feature-hero">
      <p class="hub-feature-kicker"><i class="fas fa-graduation-cap"></i> دبلومات المستخدم فقط</p>
      <h1>دبلوماتي</h1>
      <p>عند الضغط على أيقونة <strong>دبلوماتي</strong> في المنيو تظهر <strong>فقط دبلوماتك الخاصة</strong>. كتالوج كل الدبلومات يبقى في الصفحة العامة.</p>
    </section>

    <div class="hub-mine-toolbar">
      <label>
        إيميل التسجيل
        <input type="email" data-learning-email placeholder="example@gmail.com" dir="ltr" autocomplete="email" />
      </label>
      <button type="button" class="btn btn-primary" data-learning-lookup><i class="fas fa-search"></i> عرض دبلوماتي</button>
      <button type="button" class="btn btn-secondary" data-learning-refresh><i class="fas fa-rotate"></i> تحديث</button>
    </div>
    <div class="hub-mine-toolbar">
      <label>
        سجّل دبلومًا لحسابي
        <select data-learning-enroll></select>
      </label>
      <button type="button" class="btn btn-primary" data-learning-enroll-btn><i class="fas fa-plus"></i> أضف لدبلوماتي</button>
      <a class="btn btn-secondary" href="diplomas.html"><i class="fas fa-list"></i> الكتالوج العام</a>
    </div>
    <p data-learning-meta class="hub-mine-meta">أدخلي الإيميل ثم اضغطي عرض دبلوماتي</p>
    <div data-learning-root></div>
  </main>

  <script src="js/hub-auth.js"></script>
  <script src="js/hub-currency.js"></script>
  <script src="js/hub-learning-catalog.js"></script>
  <script src="js/hub-client-learning.js?v=1"></script>
  <script src="js/hub-my-learning.js?v=1"></script>
  <script src="js/hub-upload-limits.js?v=1"></script>
  <script src="js/hub-header-actions.js?v=18"></script>
  <script src="js/hub-control-nav.js?v=3"></script>
  <script src="js/hub-global-back.js" defer></script>
  <script src="js/hub-ai-assistant.js?v=4" defer></script>
</body>
</html>
