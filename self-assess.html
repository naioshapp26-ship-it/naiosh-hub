<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قيّم نفسك | نايوش هوب 360</title>
  <meta name="description" content="قيّم مهاراتك ومسارك داخل نايوش هوب واحصل على خطوة تشغيل واضحة." />
  <link rel="icon" href="assets/logo-hub.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/hub-theme.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
  <link rel="stylesheet" href="css/hub-ai-assistant.css?v=4" />
  <link rel="stylesheet" href="css/hub-header-actions.css?v=19" />
  <link rel="stylesheet" href="css/hub-home-engage.css?v=1" />
</head>
<body class="homepage">
  <header class="top-nav">
    <div class="container inner">
      <div class="nav-main">
        <a class="brand" href="index.html"><img src="assets/logo-hub.jpeg" alt="نايوش هوب" /><span class="logo-text">NAIOSH <span class="hub-mark">HUB</span></span></a>
        <nav class="nav-links">
          <a href="index.html">الرئيسية</a>
          <a href="index.html#hub-engage">بوابات التفاعل</a>
          <a class="active" href="self-assess.html">قيّم نفسك</a>
          <a href="side-projects.html">فرص المشاريع</a>
        </nav>
      </div>
      <div class="auth-actions">
        <a href="dashboard.html" class="auth-btn primary">لوحة التحكم</a>
        <a href="login.html" class="auth-btn">دخول</a>
      </div>
    </div>
  </header>

  <main class="container hub-feature-page">
    <section class="hub-feature-hero">
      <p class="hub-feature-kicker"><i class="fas fa-clipboard-check"></i> قيّم نفسك</p>
      <h1>اعرف مستواك… واختر خطوتك التالية</h1>
      <p>مسارات التقييم أدناه هي نفسها المعروضة في سيكشن الرئيسية — كل مسار ينتهي بأداة تشغيل حقيقية.</p>
      <div class="hub-feature-actions">
        <a class="btn btn-primary" href="#assess-feed"><i class="fas fa-list-check"></i> مسارات التقييم</a>
        <a class="btn btn-secondary" href="side-projects.html#sp-client-intro"><i class="fas fa-rocket"></i> تقييم فرصة</a>
        <a class="btn btn-secondary" href="index.html#hub-engage"><i class="fas fa-house"></i> سيكشن الرئيسية</a>
      </div>
    </section>

    <section class="hub-feature-section" id="assess-feed">
      <h2 class="hub-feature-section-title">مسارات التقييم الهادفة</h2>
      <div class="hub-engage-feed-list" data-engage-page="assess"></div>
    </section>
  </main>

  <script src="js/hub-auth.js"></script>
  <script src="js/hub-upload-limits.js?v=1"></script>
  <script src="js/hub-header-actions.js?v=18"></script>
  <script src="js/hub-home-engage.js?v=2"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-engage-page="assess"]');
      const eng = window.HubHomeEngage;
      if (!root || !eng) return;
      root.innerHTML = eng.ASSESS_PATHS.map(
        (a) => `<a class="hub-engage-feed-item" href="${eng.esc(a.href)}">
          <em><i class="fas ${eng.esc(a.icon)}"></i> مسار تقييم</em>
          <strong>${eng.esc(a.title)}</strong>
          <p>${eng.esc(a.blurb)}</p>
        </a>`
      ).join('');
    })();
  </script>
  <script src="js/hub-control-nav.js?v=3"></script>
  <script src="js/hub-global-back.js" defer></script>
  <script src="js/hub-ai-assistant.js?v=4" defer></script>
</body>
</html>
