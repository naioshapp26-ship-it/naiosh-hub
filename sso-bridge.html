<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جسر الدخول الموحّد | نايوش هوب 360</title>
  <meta name="description" content="تحقق هوب من تذكرة SSO وفتح النظام التخصصي بهوية NAIOSH ID." />
  <link rel="icon" href="assets/logo-hub.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/hub-theme.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
  <link rel="stylesheet" href="css/hub-header-actions.css?v=15" />
  <link rel="stylesheet" href="css/hub-dark-surfaces.css?v=20260815-contrast" />
  <link rel="stylesheet" href="css/hub-sso-bridge.css?v=1" />
</head>
<body class="homepage hub-sso-bridge-body">
  <header class="top-nav">
    <div class="container inner">
      <div class="nav-main">
        <a class="brand" href="index.html"><img src="assets/logo-hub.jpeg" alt="نايوش هوب" /><span class="logo-text">NAIOSH <span class="hub-mark">HUB</span></span></a>
        <nav class="nav-links">
          <a href="my-systems.html">أنظمتي</a>
          <a href="rent-system.html">استأجر نظامًا</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="hub-sso-bridge" data-sso-bridge>
    <div class="hub-sso-panel" data-sso-state="loading">
      <p class="hub-sso-kicker"><i class="fas fa-shield-halved"></i> Control Plane · SSO Bridge</p>
      <h1>جسر الدخول الموحّد</h1>
      <p class="hub-sso-lead" data-sso-lead>جاري التحقق من تذكرة هوب…</p>

      <div class="hub-sso-status" data-sso-status hidden></div>

      <dl class="hub-sso-meta" data-sso-meta hidden>
        <div><dt>الهوية</dt><dd data-sso-email>—</dd></div>
        <div><dt>النظام</dt><dd data-sso-system>—</dd></div>
        <div><dt>المستأجر</dt><dd data-sso-tenant dir="ltr">—</dd></div>
      </dl>

      <div class="hub-sso-actions" data-sso-actions hidden>
        <button type="button" class="hub-sso-btn is-primary" data-sso-open>
          <i class="fas fa-right-to-bracket"></i> فتح النظام الآن
        </button>
        <button type="button" class="hub-sso-btn is-ghost" data-sso-copy>
          <i class="fas fa-copy"></i> نسخ البريد
        </button>
        <a class="hub-sso-btn is-secondary" href="my-systems.html"><i class="fas fa-cubes"></i> أنظمتي</a>
      </div>

      <p class="hub-sso-note" data-sso-note hidden></p>
    </div>
  </main>

  <script src="js/hub-auth.js"></script>
  <script src="js/hub-sso-bridge.js?v=1"></script>
  <script src="js/hub-header-actions.js?v=17"></script>
</body>
</html>
