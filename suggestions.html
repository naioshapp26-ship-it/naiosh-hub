<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المقترحات | نايوش هوب 360</title>
  <meta name="description" content="أرسل مقترح تحسين مرتبط بنظام هوب — واجهة، تشغيل، حوكمة، أو ميزة جديدة." />
  <link rel="icon" href="assets/logo-hub.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/hub-theme.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
  <link rel="stylesheet" href="css/hub-ai-assistant.css?v=4" />
  <link rel="stylesheet" href="css/hub-header-actions.css?v=14" />
  <link rel="stylesheet" href="css/hub-service-requests.css?v=1" />
</head>
<body class="homepage">
  <header class="top-nav">
    <div class="container inner">
      <div class="nav-main">
        <a class="brand" href="index.html"><img src="assets/logo-hub.jpeg" alt="نايوش هوب" /><span class="logo-text">NAIOSH <span class="hub-mark">HUB</span></span></a>
        <nav class="nav-links">
          <a href="index.html">الرئيسية</a>
          <a href="consultation.html">اطلب استشارة</a>
          <a class="active" href="suggestions.html">المقترحات</a>
          <a href="complaints.html">الشكاوي</a>
        </nav>
      </div>
      <div class="auth-actions">
        <a href="dashboard.html" class="auth-btn primary">غرفة العمليات</a>
        <a href="login.html" class="auth-btn">تسجيل الدخول</a>
      </div>
    </div>
  </header>

  <main class="container hub-feature-page" data-hub-service="suggestion">
    <section class="hub-feature-hero">
      <p class="hub-feature-kicker"><i class="fas fa-lightbulb"></i> مقترحات التحسين · مربوطة بالنظام</p>
      <h1>المقترحات</h1>
      <p>اقترح تحسينًا على هوب أو أحد الأنظمة المرتبطة — يُسجَّل كطلب تشغيلي ويُراجع من غرفة العمليات دون تكرار قنوات.</p>
    </section>

    <section class="hub-feature-section">
      <h2 class="hub-feature-section-title">نموذج المقترح</h2>
      <form class="hub-service-form" data-service-form>
        <div class="hub-service-grid-2">
          <label>الاسم بالكامل <input name="fullName" required autocomplete="name" /></label>
          <label>الجوال <input name="phone" type="tel" required autocomplete="tel" /></label>
        </div>
        <label>البريد الإلكتروني <input name="email" type="email" required autocomplete="email" /></label>
        <div class="hub-service-grid-2">
          <label>النظام المستهدف
            <select name="system" required>
              <option value="HUB">هوب — الواجهة والتشغيل</option>
              <option value="ERP">إي آر بي</option>
              <option value="NAIS">نايس</option>
              <option value="LAW">لو</option>
              <option value="ACADEMY">أكاديمية</option>
              <option value="FIT">فيت</option>
              <option value="STORE">المتجر والرصيد</option>
              <option value="INCUBATOR">الحاضنات</option>
              <option value="PLATFORM">المنصات</option>
              <option value="CHAT">الدردشة الداخلية</option>
            </select>
          </label>
          <label>تصنيف المقترح
            <select name="category" required>
              <option value="واجهة">تحسين واجهة</option>
              <option value="ميزة">ميزة جديدة</option>
              <option value="تشغيل">تبسيط تشغيل</option>
              <option value="أداء">أداء وسرعة</option>
              <option value="حوكمة">حوكمة وتقارير</option>
              <option value="اخرى">أخرى</option>
            </select>
          </label>
        </div>
        <label>أولوية الأثر
          <select name="priority">
            <option>عادي</option>
            <option>مهم</option>
            <option>عالي</option>
          </select>
        </label>
        <label>عنوان المقترح <input name="title" required placeholder="مثال: إضافة فلتر سريع في غرفة العمليات" /></label>
        <label>وصف المقترح والفائدة المتوقعة <textarea name="body" rows="5" required placeholder="ما المشكلة الحالية؟ وما الحل المقترح؟ وكيف يخدم تشغيل الأنظمة الـ41؟"></textarea></label>
        <input type="hidden" name="contactMethod" value="بريد" />
        <button type="submit" class="btn btn-primary"><i class="fas fa-lightbulb"></i> إرسال المقترح</button>
        <p class="hub-service-feedback" data-service-feedback hidden role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="hub-feature-section">
      <h2 class="hub-feature-section-title">مقترحاتي الأخيرة</h2>
      <div class="hub-feature-grid" data-service-list></div>
    </section>
  </main>

  <script src="js/hub-marketplace-data.js"></script>
  <script src="js/hub-store.js"></script>
  <script src="js/hub-auth.js"></script>
  <script src="js/hub-header-actions.js?v=17"></script>
  <script src="js/hub-service-requests.js?v=1"></script>
  <script src="js/hub-service-pages.js?v=1"></script>
  <script src="js/hub-global-back.js" defer></script>
  <script src="js/hub-ai-assistant.js?v=4" defer></script>
</body>
</html>
