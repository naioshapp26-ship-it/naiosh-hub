<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدعم والصيانة | نايوش هوب 360</title>
  <link rel="icon" href="assets/logo-hub.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/hub-theme.css" />
  <link rel="stylesheet" href="css/hub-chrome.css" />
  <link rel="stylesheet" href="css/hub-header-actions.css?v=11" />
  <link rel="stylesheet" href="css/hub-user-facilitation.css?v=1" />
</head>
<body class="homepage">
  <header class="top-nav">
    <div class="container inner">
      <div class="nav-main">
        <a class="brand" href="index.html"><img src="assets/logo-hub.jpeg" alt="نايوش هوب" /><span class="logo-text">NAIOSH <span class="hub-mark">HUB</span></span></a>
        <nav class="nav-links">
          <a href="index.html">الرئيسية</a>
          <a href="dashboard.html">غرفة العمليات</a>
          <a class="active" href="support.html">الدعم</a>
          <a href="chat.html">الدردشة</a>
        </nav>
      </div>
      <div class="auth-actions">
        <a href="office.html" class="auth-btn">مكتبي</a>
        <a href="login.html" class="auth-btn primary">تسجيل الدخول</a>
      </div>
    </div>
  </header>

  <main class="container hub-feature-page" data-hub-support>
    <section class="hub-feature-hero">
      <p class="hub-feature-kicker"><i class="fas fa-headset"></i> غرفة العمليات · الدعم</p>
      <h1>طلبات الصيانة والدعم الفني</h1>
      <p>أرسل مشكلة تشغيل أو طلب مساعدة — تُسجَّل كتذكرة داخل هوب ويمكن متابعتها من مكتبك.</p>
    </section>

    <section class="hub-feature-section">
      <h2 class="hub-feature-section-title">تذكرة جديدة</h2>
      <form class="hub-support-form" data-support-form>
        <label>العنوان <input name="title" required placeholder="مثال: تعذّر فتح النظام / خطأ في الرصيد" /></label>
        <label>النظام
          <select name="system">
            <option value="HUB">هوب</option>
            <option value="ERP">إي آر بي</option>
            <option value="NAIS">نايس</option>
            <option value="LAW">لو</option>
            <option value="ACADEMY">أكاديمية</option>
            <option value="FIT">فيت</option>
          </select>
        </label>
        <label>الأولوية
          <select name="priority">
            <option>عادي</option>
            <option>عاجل</option>
            <option>حرج</option>
          </select>
        </label>
        <label>التفاصيل <textarea name="body" rows="4" placeholder="اشرح المشكلة وما الذي ظهر أثناء التشغيل"></textarea></label>
        <button type="submit" class="btn btn-primary">إرسال التذكرة</button>
      </form>
    </section>

    <section class="hub-feature-section">
      <h2 class="hub-feature-section-title">تذاكري</h2>
      <div class="hub-feature-grid" data-support-list></div>
    </section>
  </main>

  <script src="js/hub-auth.js"></script>
  <script src="js/hub-tenant-context.js"></script>
  <script src="js/hub-support-tickets.js"></script>
  <script src="js/hub-cart.js"></script>
  <script src="js/hub-header-actions.js?v=10"></script>
  <script src="js/hub-support-page.js"></script>
  <script src="js/hub-global-back.js" defer></script>
</body>
</html>
