  <script src="../js/hub-live-systems.js"></script>
  <script>
    (function () {
      var live = window.HubLiveSystems && window.HubLiveSystems.url('SMARTX');
      if (live) {
        var u = live;
        try {
          var q = window.location.search || '';
          if (q && live.indexOf('?') === -1) u = live.replace(/\/?$/, '/') + q.replace(/^\?/, '?');
          else if (q) u = live + (live.indexOf('?') >= 0 ? '&' : '?') + q.slice(1);
        } catch (e) {}
        window.location.replace(u);
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
